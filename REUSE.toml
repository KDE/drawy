version = 1

[[annotations]]
path = ["src/icons/*.png", "src/icons/*.svg", "src/widgets/resources/icons/**/*.svg", "src/widgets/resources/cursors/**/*.svg", "src/widgets/resources/cursors/**/*.png", "assets/**/*.svg", "assets/**/*.png", "CHANGELOG.md", "android/res/drawable/drawy.png"]
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["flake.lock", "src/widgets/autotests/data/**", "src/gui/autotests/data/**", "src/plugins/basicshapes/basicshapes_plugin.json"]
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["src/data/org.kde.drawy.desktop", "src/data/org.kde.drawy.metainfo.xml", "src/data/application-x-drawy.xml", ".gersemirc", "src/widgets/resources/res.qrc"]
SPDX-FileCopyrightText = "Prayag Jain <prayagjain2@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["po/**", "poqm/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "LGPL-2.0-or-later"

[[annotations]]
path = ["README-pre-commit.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2023-2026 Laurent Montel <montel@kde.org>"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = ["CMakePresets.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2021-2026 Laurent Montel <montel@kde.org>"
SPDX-License-Identifier = "BSD-3-Clause"
