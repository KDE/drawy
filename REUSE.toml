version = 1

[[annotations]]
path = ["src/resources/icons/**/*.svg", "**/*.png", "**/*.svg", "**/*.ico"]
SPDX-FileCopyrightText = "www.svgrepo.com"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["flake.lock", "src/widgets/autotests/data/**"]
SPDX-FileCopyrightText = "None"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["src/data/org.kde.drawy.desktop", "src/data/org.kde.drawy.metainfo.xml", ".gersemirc"]
SPDX-FileCopyrightText = "Prayag Jain <prayagjain2@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["po/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "LGPL-2.0-or-later"

[[annotations]]
path = ["README-pre-commit.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2023-2026 Laurent Montel <montel@kde.org>"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = ["CMakePresets.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2021-2026 Laurent Montel <montel@kde.org>"
SPDX-License-Identifier = "BSD-3-Clause"
